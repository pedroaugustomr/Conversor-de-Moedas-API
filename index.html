<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Roboto:ital@0;1&display=swap"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="./style.css">

    <title>Convert Money</title>

</head>


<body>

    <img
        class="logo"
        src="./assets/logo.gif"
        alt="logo convert money"
    >


    <main>

        <!-- CONVERTER DE -->

        <label>

            Converter <b>de</b>

            <select class="currency-select-from">

                <option value="real">
                    R$ Real Brasileiro
                </option>

                <option value="dolar">
                    US$ Dólar Americano
                </option>

                <option value="euro">
                    € Euro
                </option>

                <option value="libra">
                    £ Libra Esterlina
                </option>

                <option value="iene">
                    ¥ Iene Japonês
                </option>

                <option value="bitcoin">
                    ₿ Bitcoin
                </option>

            </select>

        </label>


        <!-- MOEDA CONVERTIDA -->

        <label>

            Converter <b>para</b>

            <select class="currency-select">

                <option value="dolar">
                    US$ Dólar Americano
                </option>

                <option value="real">
                    R$ Real Brasileiro
                </option>

                <option value="euro">
                    € Euro
                </option>

                <option value="libra">
                    £ Libra Esterlina
                </option>

                <option value="iene">
                    ¥ Iene Japonês
                </option>

                <option value="bitcoin">
                    ₿ Bitcoin
                </option>

            </select>

        </label>


        <!-- VALOR A CONVERTER -->

        <label>

            Valor

            <input
                class="input-currency"
                type="number"
                placeholder="Digite o valor a ser convertido"
            >

        </label>


        <button class="convert-button">
            Converter
        </button>


        <!-- RESULTADO -->

        <section>


            <!-- MOEDA DE ORIGEM -->

            <div class="currency-box">

                <img
                    class="currency-img-to-convert"
                    src="./assets/real.png"
                    alt="logo da moeda de origem"
                >

                <p class="currency currency-name-to-convert">
                    Real Brasileiro
                </p>

                <p class="currency-value-to-convert">
                    R$ 0,00
                </p>

            </div>


            <!-- SETA -->

            <img
                class="arrow-img"
                src="./assets/arrow.png"
                alt="seta"
            >


            <!-- MOEDA DE DESTINO -->

            <div class="currency-box">

                <img
                    class="currency-img"
                    src="./assets/dolar.png"
                    alt="logo da moeda de destino"
                >

                <p
                    class="currency"
                    id="currency-name"
                >
                    Dólar Americano
                </p>

                <p class="currency-value">
                    US$ 0,00
                </p>

            </div>


        </section>

    </main>


    <script src="./scripts.js"></script>

</body>

</html>
